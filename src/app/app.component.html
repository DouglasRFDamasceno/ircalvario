<ion-app>
  <ion-split-pane contentId="main-content" when="false">
    <ion-menu contentId="main-content" type="overlay" id="main-menu" aria-label="Menu principal">
      <ion-content>
        <ion-list role="menu" aria-labelledby="menu-header" id="inbox-list">
          <ion-list-header id="menu-header" class="menu-list-header">
            <ion-icon name="church" slot="start" class="menu-header-icon"></ion-icon>
            <span class="menu-header-text">Igreja Reformada do Calvário</span>
          </ion-list-header>

          <ion-menu-toggle auto-hide="true" *ngFor="let p of appPages">
            <ion-item
              role="menuitem"
              routerDirection="root"
              [routerLink]="p.url"
              lines="none"
              detail="false"
              routerLinkActive="selected"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <ion-icon
                aria-hidden="true"
                slot="start"
                [ios]="p.icon + '-outline'"
                [md]="p.icon + '-sharp'"
              ></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>

      <ion-footer>
        <ion-toolbar>
          <ion-button expand="block" color="danger" (click)="logout()">
            <ion-icon slot="start" name="log-out"></ion-icon>
            Sair
          </ion-button>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
