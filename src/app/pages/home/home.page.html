<ion-content>
  <div
    class="video-player-overlay"
    [class.show]="showPlayer"
    (click)="closeVideo()"
  >
    <div class="video-container" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeVideo()">×</button>
      <iframe
        *ngIf="videoUrl"
        [src]="videoUrl"
        frameborder="0"
        allowfullscreen
        allow="autoplay; encrypted-media"
      ></iframe>
    </div>
  </div>

  <section class="swiper-section">
    <div class="youtube-title">
      <div class="youtube-logo">
        <ion-icon name="play"></ion-icon>
      </div>
      <span class="youtube-text">YouTube</span>
    </div>

    <swiper-container
      slides-per-view="2"
      space-between="10"
      autoplay-delay="5000"
      autoplay-disable-on-interaction="false"
      navigation="true"
    >
      <swiper-slide *ngFor="let id of videoIds; let i = index">
        <div class="video-thumbnail-container" (click)="openVideo(i)">
          <img
            [src]="getThumbnailUrl(id)"
            alt="Thumbnail"
            class="video-thumbnail"
          />
          <ion-icon name="play-circle" class="play-icon"></ion-icon>
        </div>
      </swiper-slide>
    </swiper-container>
  </section>

  <section class="contact-section">
    <h2 class="contact-title">Contato</h2>
    <div class="contact-wrapper">
      <div class="contact-image">
        <img src="assets/imgs/igreja.jpeg" alt="Igreja" />
      </div>

      <div class="contact-map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3755.123456789!2d-45.569876!3d-22.274567!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c5f123456789%3A0xabcdef123456789!2sR.%20Ver.%20Joaquim%20Domingos%20Sim%C3%B5es%2C%2040%20-%20Santa%20Rita%20Do%20Sapuca%C3%AD!5e0!3m2!1spt-BR!2sbr!4v1692025200000!5m2!1spt-BR!2sbr"
          width="100%"
          height="300"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </section>
  <app-footer></app-footer>
</ion-content>
