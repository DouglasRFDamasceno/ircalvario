<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div id="header">
    <div id="app-bar">
      <div id="logo">
        <img src="assets/imgs/backend.png" alt="Logo da aplicação" />
      </div>
    </div>

    <h2 class="header-title">Bem-vindo!</h2>
    <p class="header-subtitle">Entre para continuar</p>
  </div>

  <div class="wrapper">
    <ion-card class="form-wrapper">
      <ion-card-content>
        <ion-item>
          <ion-icon name="mail" slot="start"></ion-icon>
          <ion-input type="email" label="E-mail" label-placement="floating" aria-label="Digite seu e-mail"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed" slot="start"></ion-icon>
          <ion-input type="password" label="Senha" label-placement="floating" aria-label="Digite sua senha">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        <ion-button expand="block" aria-label="Entrar">Entrar</ion-button>
      </ion-card-content>
    </ion-card>

    <div class="line-text">
      <span class="lines"></span>
      <span class="text">ou entre com</span>
    </div>

    <ion-card class="social-wrapper">
      <ion-card-content>
        <div class="socials">
          <ion-button class="btn-fb" aria-label="Entrar com Facebook">
            <ion-icon name="logo-facebook"></ion-icon>
          </ion-button>
          <ion-button class="btn-tw" aria-label="Entrar com Twitter">
            <ion-icon name="logo-twitter"></ion-icon>
          </ion-button>
          <ion-button class="btn-ins" aria-label="Entrar com Instagram">
            <ion-icon name="logo-instagram"></ion-icon>
          </ion-button>
          <ion-button class="btn-ph" aria-label="Entrar com telefone">
            <ion-icon name="call-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
